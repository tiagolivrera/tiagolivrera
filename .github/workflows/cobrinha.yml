name: Generate Datas

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      # Snake Animation
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: tiagolivrera
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Stats cards
      - uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=tiagolivrera&show_icons=true&theme=dracula&include_all_commits=true&count_private=true
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=tiagolivrera&layout=compact&langs_count=7&theme=dracula
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
